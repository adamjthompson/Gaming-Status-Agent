# Builds Gaming Status Agent.exe on Windows and attaches it, plus a Linux
# archive, to the GitHub Release for the tag. Releases are numbered by date
# (2026.10.1 = first release of October 2026); each agent keeps its own app
# version in GSA_VERSION. Runs when such a tag is pushed, including one created
# from the Releases page.
#
#   git tag 2026.10.1 && git push origin 2026.10.1

name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and re-upload, e.g. 2026.10.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read app versions
        run: |
          $win = (Select-String -Path windows/gsa_tracker.py -Pattern '^GSA_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $lin = (Select-String -Path linux/gsa_linux.py -Pattern '^GSA_VERSION = "(.+)"').Matches[0].Groups[1].Value
          # Both versions end up in asset names, release notes and exe metadata,
          # so a missing or malformed one stops the release rather than shipping it.
          foreach ($v in @(@("windows/gsa_tracker.py", $win), @("linux/gsa_linux.py", $lin))) {
            if ($v[1] -notmatch '^\d+\.\d+\.\d+$') {
              Write-Error "GSA_VERSION in $($v[0]) must look like 1.2.3, found '$($v[1])'"
              exit 1
            }
          }
          "WIN_VERSION=$win" >> $env:GITHUB_ENV
          "LINUX_VERSION=$lin" >> $env:GITHUB_ENV
          Write-Host "Release $env:TAG: Windows $win, Linux $lin"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt "pyinstaller>=6.0"

      - name: Build exe
        working-directory: windows
        run: |
          python make_version_info.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "Gaming Status Agent" `
            --icon=../assets/gsa_icon.ico `
            --add-data '../assets/gsa_icon.ico;.' `
            --version-file=version_info.txt `
            gsa_tracker.py

      - name: Package Linux agent
        run: |
          New-Item -ItemType Directory -Force staging/gaming-status-agent | Out-Null
          Copy-Item -Recurse linux, assets, README.md staging/gaming-status-agent/
          Compress-Archive -Path staging/gaming-status-agent -DestinationPath "gaming-status-agent-linux-$env:LINUX_VERSION.zip"

      - name: Publish release
        run: |
          $files = @("windows/dist/Gaming Status Agent.exe", "gaming-status-agent-linux-$env:LINUX_VERSION.zip")
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # Created from the Releases page: add the builds, keep its notes.
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "Gaming Status Agent $env:TAG" `
              --notes "Builds: Windows $env:WIN_VERSION · Linux $env:LINUX_VERSION" --generate-notes
          }
